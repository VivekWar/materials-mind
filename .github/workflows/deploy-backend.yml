name: Deploy Backend to Hugging Face Spaces

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy to HF Space via Git
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push backend to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          # Configure Git
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Clone the HF Space repo
          echo "Cloning HF Space..."
          git clone https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME hf-space
          
          # Copy backend files into the space (this won't overwrite the README.md if we don't have one in backend/)
          echo "Copying backend files..."
          cp -a backend/. hf-space/
          
          # Commit and Push
          cd hf-space
          git add .
          git commit -m "Deploy backend from GitHub Actions (Commit: ${{ github.sha }})" || echo "No changes to commit"
          git push

      - name: Wait for Space to become healthy
        run: |
          echo "Waiting for HF Space to start..."
          # HF Space URL format: https://{username}-{space-name}.hf.space
          SPACE_URL="https://${{ secrets.HF_USERNAME }}-${{ secrets.HF_SPACE_NAME }}.hf.space"
          # Replace underscores with hyphens (HF converts them in URLs)
          SPACE_URL="${SPACE_URL//_/-}"
          echo "Polling: $SPACE_URL/health"
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SPACE_URL/health")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend is healthy!"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Backend did not become healthy within 4 minutes"
          exit 1
