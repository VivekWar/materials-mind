version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: materialmind_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: materialmind
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: materialmind_pgbouncer
    environment:
      DB_USER: postgres
      DB_PASSWORD: password123
      DB_HOST: postgres
      DB_PORT: 5432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:5432"
    depends_on:
      - postgres
    restart: always

  redis:
    image: redis/redis-stack:latest
    container_name: materialmind_redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    restart: always

  nginx:
    image: nginx:latest
    container_name: materialmind_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

volumes:
  postgres_data:
  redis_data: