version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: materialmind_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: materialmind
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis/redis-stack:latest
    container_name: materialmind_redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data: