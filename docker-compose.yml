version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: materialmind_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: materialmind
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  pgbouncer:
    image: bitnami/pgbouncer:latest
    container_name: materialmind_pgbouncer
    environment:
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: password123
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      PGBOUNCER_DATABASE: materialmind
      PGBOUNCER_POOL_MODE: transaction
    ports:
      - "6432:6432"
    depends_on:
      - postgres
    restart: always

  redis:
    image: redis/redis-stack:latest
    container_name: materialmind_redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    restart: always

  nginx:
    image: nginx:latest
    container_name: materialmind_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

volumes:
  postgres_data:
  redis_data: